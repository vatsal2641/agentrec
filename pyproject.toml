[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrec"
version = "0.1.0"
description = "Two-stage recommender + contextual bandit + tool-calling agent, built from first principles in numpy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["httpx>=0.25"]          # talk to Ollama / any OpenAI-compatible server
ann = ["faiss-cpu>=1.7"]        # optional: compare our numpy IVF against FAISS
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
